services:
  telegram-sender:
    build: .
    container_name: telegram-sender
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CONFIG_PATH: /data/.env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      # конфиг (в т.ч. ADMIN_KEY) переживает пересоздание контейнера
      - ./data:/data
